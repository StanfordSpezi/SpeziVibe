name: Release Skills

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-skills:
    name: Upload Skills Archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create skills zip
        run: cd skills && zip -r ../spezivibe-skills.zip .
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" spezivibe-skills.zip
