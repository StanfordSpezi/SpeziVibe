name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (in dependency order)
        run: |
          npm run build --workspace=@spezivibe/account
          npm run build --workspace=@spezivibe/onboarding
          npm run build --workspace=@spezivibe/scheduler
          npm run build --workspace=@spezivibe/questionnaire
          npm run build --workspace=@spezivibe/chat
          npm run build --workspace=@spezivibe/firebase

      - name: Build CLI
        run: npm run build --workspace=create-spezivibe-app

      - name: Typecheck packages
        run: npm run typecheck --workspaces --if-present

      - name: Run unit tests
        run: npm run test --workspaces --if-present

  test-cli:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build --workspace=@spezivibe/account
          npm run build --workspace=@spezivibe/onboarding
          npm run build --workspace=@spezivibe/scheduler
          npm run build --workspace=@spezivibe/questionnaire
          npm run build --workspace=@spezivibe/chat
          npm run build --workspace=@spezivibe/firebase

      - name: Build CLI
        run: npm run build --workspace=create-spezivibe-app

      - name: Test CLI - All permutations
        run: node cli/scripts/test-ci-permutations.js
